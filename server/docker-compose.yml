# The impostor proxy in a container.
#
#   cd server && docker compose up -d --build
#
# It reads the `.env` one folder up — the same one the local run uses — so
# there is one place the key lives and no second copy to drift. Everything else has a default that matches
# what `npm run impostor:server` would give you.

name: an-impostor

services:
  impostor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: an-impostor-server

    # The whole file, so OPENROUTER_MODEL and the routing variables come along
    # with the key rather than having to be listed twice. The EXPO_PUBLIC_*
    # entries in there are ignored by the server — they are the app's.
    env_file:
      - ../.env

    environment:
      # Named explicitly so the container has a port even with no .env at all,
      # and so the mapping below cannot silently disagree with it.
      IMPOSTOR_PORT: 8787

    ports:
      # Host 8787 is what the Android emulator already reaches through
      # `adb reverse tcp:8787 tcp:8787`, so nothing on the app side changes.
      # Loopback only: the public way in is the Cloudflare tunnel (cloudflared
      # runs with host networking), so nobody can reach the server — and spend
      # the OpenRouter key — by going round it to the machine's IP.
      - "127.0.0.1:${IMPOSTOR_PORT:-8787}:8787"

    # Match logs and the penalty box live on the host, so they survive a
    # rebuild — and so the `node` user can write them at all, since the image's
    # /app/server belongs to root.
    volumes:
      - ./logs:/app/server/logs
      - ./data:/app/server/data

    # The server prints a session cost report on SIGTERM, so give it a moment
    # to do that rather than killing it at the default 10s.
    stop_grace_period: 20s

    restart: unless-stopped

    healthcheck:
      # `/health` exists for exactly this — the app checks it before starting a
      # match so a room does not discover the server is down on the impostor's
      # first turn. wget is in busybox; there is no curl in the alpine image.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
